dependencies {
  // Also provides org.jsoup, which Liferay exports at runtime (com.liferay.shared.dependencies.jsoup)
  compileOnly libs.liferay.dxp.api
  compileOnly libs.osgi.jaxrs
  compileOnly project(":modules:jod-ohjaaja-cms-util")
  compileOnly project(":modules:jod-ohjaaja-cms-navigation")

  testImplementation libs.junit
  testImplementation libs.liferay.dxp.api
  testImplementation project(":modules:jod-ohjaaja-cms-util")
  testImplementation project(":modules:jod-ohjaaja-cms-navigation")
  testRuntimeOnly libs.log4j.api
  testRuntimeOnly libs.log4j.core
}

test {
  useJUnit()

  // Liferay's LogFactoryUtil needs reflective access when initialized outside the portal
  jvmArgs = [
      '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED',
      '--add-opens=java.base/java.lang=ALL-UNNAMED'
  ]
}
