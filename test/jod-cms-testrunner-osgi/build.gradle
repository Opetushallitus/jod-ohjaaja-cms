plugins {
  id 'java-library'
  id 'biz.aQute.bnd.builder'
}

repositories {
  mavenCentral()
  maven {
    url "https://repository.liferay.com/nexus/content/groups/public"
  }
}

// Version is derived in the root project from gradle.properties (no fallback).
def dxpApiVersion = rootProject.jodLiferayArtifactVersion

dependencies {
  // We only need the shared JITEF helpers from the client module; everything else there is
  // host-side scaffolding that would pull in JUnit/bnd transitively. Pulling it in as compileOnly
  // is enough because bnd embeds the jitef package below via Private-Package.
  compileOnly project(':test:jod-cms-testrunner-client')

  compileOnly "com.liferay.portal:release.dxp.api:${dxpApiVersion}"
  compileOnly libs.osgi.core
  compileOnly libs.osgi.cmpn.annotations
  compileOnly libs.osgi.http.whiteboard
  compileOnly libs.jakarta.servlet.api
  compileOnly libs.osgi.log
}
