name: upgrade_liferay
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: "Environment to upgrade"
        required: true
        default: "dev"
        options:
          - dev
          - test
          - production
      tag:
        type: string
        description: "Image tag to deploy"
        required: true

jobs:
  upgrade:
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: upgrade-${{ inputs.environment }}

    steps:
      - uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6
        with:
          role-to-assume: ${{ secrets.JOD_AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Take Aurora snapshot
        id: snapshot
        run: |
          TS=$(date +%Y%m%d-%H%M%S)
          SNAPSHOT_ID="${{ secrets.JOD_DB_CLUSTER_IDENTIFIER }}-snapshot-$TS"
          echo "Creating snapshot $SNAPSHOT_ID"
          aws rds create-db-cluster-snapshot \
            --db-cluster-identifier "${{ secrets.JOD_DB_CLUSTER_IDENTIFIER }}" \
            --db-cluster-snapshot-identifier "$SNAPSHOT_ID"
          echo "snapshot_id=$SNAPSHOT_ID" >> $GITHUB_OUTPUT

      - name: Wait for snapshot to be ready
        run: |
          aws rds wait db-cluster-snapshot-available \
            --db-cluster-snapshot-identifier ${{ steps.snapshot.outputs.snapshot_id }}

      - name: Download task definition
        run: >
          aws ecs describe-task-definition
          --task-definition ${{ vars.JOD_ECS_TASKDEF }}
          --query taskDefinition > raw-task-definition.json

      - name: Remove ignored properties from task definition
        run: >
          jq 'del(.compatibilities,
          .taskDefinitionArn,
          .requiresAttributes,
          .revision,
          .status,
          .registeredAt,
          .deregisteredAt,
          .registeredBy)'
          raw-task-definition.json > task-definition.json

      - uses: aws-actions/amazon-ecs-render-task-definition@77954e213ba1f9f9cb016b86a1d4f6fcdea0d57e # v1
        id: render-task-def
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.JOD_ECS_APP_CONTAINER }}
          image: ${{ secrets.JOD_ECR }}/oph/jod-ohjaaja-cms:${{ inputs.tag }}
          environment-variables: "LIFERAY_UPGRADE_PERIOD_DATABASE_PERIOD_AUTO_PERIOD_RUN=true"

      - name: Scale ECS service down
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.JOD_ECS_CLUSTER }} \
            --service ${{ secrets.JOD_ECS_SERVICE }} \
            --desired-count 0

      - name: Wait until service tasks are stopped
        timeout-minutes: 10
        run: |
          while true; do
            COUNT=$(aws ecs list-tasks \
              --cluster ${{ secrets.JOD_ECS_CLUSTER }} \
              --service-name ${{ secrets.JOD_ECS_SERVICE }} \
              --desired-status RUNNING \
              --query "taskArns" --output text | wc -w)
            echo "Running tasks: $COUNT"
            [ "$COUNT" -eq 0 ] && break
            sleep 10
          done

      - name: Register upgrade task definition
        id: register
        run: |
          TD_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://${{ steps.render-task-def.outputs.task-definition }} \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered: $TD_ARN"
          echo "td_arn=$TD_ARN" >> $GITHUB_OUTPUT

      - name: Run upgrade as a one-off task
        id: run-task
        run: |
          NETCFG=$(aws ecs describe-services \
            --cluster ${{ secrets.JOD_ECS_CLUSTER }} \
            --services ${{ secrets.JOD_ECS_SERVICE }} \
            --query 'services[0].networkConfiguration' --output json)

          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ secrets.JOD_ECS_CLUSTER }} \
            --task-definition ${{ steps.register.outputs.td_arn }} \
            --count 1 \
            --launch-type FARGATE \
            --enable-execute-command \
            --network-configuration "$NETCFG" \
            --started-by "upgrade-wf-${{ github.run_id }}" \
            --query 'tasks[0].taskArn' --output text)
          echo "Upgrade task: $TASK_ARN"
          echo "task_arn=$TASK_ARN" >> $GITHUB_OUTPUT

      - name: Wait for upgrade to complete (container reports HEALTHY)
        timeout-minutes: 60
        run: |
          TASK="${{ steps.run-task.outputs.task_arn }}"
          while true; do
            read -r LAST HEALTH <<< "$(aws ecs describe-tasks \
              --cluster ${{ secrets.JOD_ECS_CLUSTER }} --tasks "$TASK" \
              --query 'tasks[0].[lastStatus,healthStatus]' --output text)"
            echo "$(date -u +%H:%M:%S) status=$LAST health=$HEALTH"

            if [ "$LAST" = "STOPPED" ]; then
              echo "::error::Upgrade task stopped before becoming healthy"
              aws ecs describe-tasks \
                --cluster ${{ secrets.JOD_ECS_CLUSTER }} --tasks "$TASK" \
                --query 'tasks[0].[stoppedReason,containers[0].exitCode]' --output text
              exit 1
            fi
            [ "$HEALTH" = "HEALTHY" ] && break
            sleep 20
          done
          echo "Upgrade completed — portal responded on its health check."

      - name: Stop the one-off task
        if: always()
        run: |
          TASK="${{ steps.run-task.outputs.task_arn }}"
          if [ -n "$TASK" ] && [ "$TASK" != "None" ]; then
            aws ecs stop-task \
              --cluster ${{ secrets.JOD_ECS_CLUSTER }} \
              --task "$TASK" \
              --reason "Upgrade workflow finished (run ${{ github.run_id }})" >/dev/null || true
          fi

  deploy:
    needs: upgrade
    uses: ./.github/workflows/deploy.yml
    permissions:
      id-token: write
      contents: write
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      tag: ${{ inputs.tag }}
