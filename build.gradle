// Check GETTING_STARTED.markdown for information regarding usage.

plugins {
  alias(libs.plugins.spotless) apply false
}

ext.jodFailedIntegrationTestModules = Collections.synchronizedList([])

// The Liferay test container (image liferay-test, built from Dockerfile.test). The integration
// tests run inside it with "docker exec" (see gradle/jod.integration-test.gradle).
ext.jodTestContainerName = 'liferay-test-container'

// Where dockerRunTestContainer mounts the project directory and the Gradle user home inside the
// container. The integration test classpath is translated to these paths.
ext.jodContainerProjectDir = '/project'
ext.jodContainerGradleHomeDir = '/gradle-home'

// -PintegrationTests=FooTest,BarTest runs only those integration test classes (simple names).
// null runs them all. See gradle/jod.integration-test.gradle.
ext.jodSelectedIntegrationTests = providers.gradleProperty('integrationTests')
    .map { it.split(',').collect { it.trim() }.findAll { !it.isEmpty() } as Set }
    .getOrNull()
if (jodSelectedIntegrationTests != null && jodSelectedIntegrationTests.isEmpty()) {
  // An empty selection would skip every module and report success without running a test.
  throw new GradleException('-PintegrationTests is empty: give test class names, or leave the property out to run all tests')
}

// A module's test JVM is killed after this many minutes, so that a test hanging inside Liferay
// fails the module instead of blocking the build.
ext.jodIntegrationTestTimeoutMinutes = 30

// "running healthy", "running starting", "exited unhealthy", ... or "absent" when there is no
// such container.
ext.jodTestContainerState = { ->
  def output = new ByteArrayOutputStream()
  def result = exec {
    commandLine 'docker', 'inspect', '--format', '{{.State.Status}} {{.State.Health.Status}}', jodTestContainerName
    standardOutput = output
    errorOutput = OutputStream.nullOutputStream()
    ignoreExitValue = true
  }
  return result.exitValue == 0 ? output.toString().trim() : 'absent'
}

ext.jodRemoveTestContainer = { ->
  exec {
    commandLine 'docker', 'rm', '--force', '--volumes', jodTestContainerName
    standardOutput = OutputStream.nullOutputStream()
    errorOutput = OutputStream.nullOutputStream()
    ignoreExitValue = true
  }
}

// The image a container was created from, or '' when there is no such container.
ext.jodTestContainerImageId = { ->
  def output = new ByteArrayOutputStream()
  def result = exec {
    commandLine 'docker', 'inspect', '--format', '{{.Image}}', jodTestContainerName
    standardOutput = output
    errorOutput = OutputStream.nullOutputStream()
    ignoreExitValue = true
  }
  return result.exitValue == 0 ? output.toString().trim() : ''
}

ext.jodTestImageId = { ->
  def output = new ByteArrayOutputStream()
  exec {
    commandLine 'docker', 'images', '--quiet', '--no-trunc', 'liferay-test'
    standardOutput = output
  }
  return output.toString().trim()
}

// Removes an earlier liferay-test image that a rebuild left without a tag. Does nothing when the
// image is the current one, still carries a tag, or is still used by a container.
ext.jodRemoveStaleTestImage = { String imageId ->
  if (!imageId || imageId == jodTestImageId()) {
    return
  }
  def tags = new ByteArrayOutputStream()
  def result = exec {
    commandLine 'docker', 'image', 'inspect', '--format', '{{len .RepoTags}}', imageId
    standardOutput = tags
    errorOutput = OutputStream.nullOutputStream()
    ignoreExitValue = true
  }
  if (result.exitValue == 0 && tags.toString().trim() == '0') {
    exec {
      commandLine 'docker', 'rmi', imageId
      standardOutput = OutputStream.nullOutputStream()
      errorOutput = OutputStream.nullOutputStream()
      ignoreExitValue = true
    }
  }
}

// True unless this build starts the container without running the whole workflow, i.e. unless the
// container is meant to stay up for running single modules against it.
ext.jodTestContainerCleanupWanted = { ->
  !gradle.taskGraph.hasTask(':dockerRunTestContainer') || gradle.taskGraph.hasTask(':testWithDockerContainer')
}

subprojects { subproject ->
  subproject.pluginManager.withPlugin('java') {
    subproject.apply plugin: 'com.diffplug.spotless'
    subproject.apply from: rootProject.file('gradle/jod.spotless.gradle')

    // Liferay DXP 2026.Q2 runs on Java 21. Bundles compiled with a newer JDK get osgi.ee=UNKNOWN
    // and fail to resolve, whatever JDK runs Gradle.
    subproject.java {
      toolchain {
        languageVersion = JavaLanguageVersion.of(21)
      }
    }
  }
}

// The Liferay product version has a single source of truth: gradle.properties.
// There are deliberately no fallback values - a stale default would silently build
// against the wrong Liferay version, which is worse than failing loudly.
def requireProperty = { String name ->
  def value = providers.gradleProperty(name).getOrNull()
  if (value == null || value.trim().isEmpty()) {
    throw new GradleException("Required Gradle property is missing: ${name} (see gradle.properties)")
  }
  return value.trim()
}

def liferayProduct = requireProperty('liferay.workspace.product')
def liferayDockerImage = requireProperty('liferay.workspace.docker.image.liferay')

// dxp-2026.q2.9 -> 2026.q2.9, dxp-2026.q1.9-lts -> 2026.q1.9-lts
def liferayDxpTag = liferayProduct.replaceFirst(/^dxp-/, '')

// Maven artifact versions do not carry the -lts suffix
def liferayArtifactVersion = liferayDxpTag.replaceFirst(/-lts$/, '')

// Exposed to subprojects so the version is derived in exactly one place.
ext.jodLiferayDockerImage = liferayDockerImage
ext.jodLiferayDxpTag = liferayDxpTag
ext.jodLiferayArtifactVersion = liferayArtifactVersion

tasks.register('syncDockerEnv') {
  group = 'build'
  description = 'Write .env (LIFERAY_DXP_TAG) from liferay.workspace.product for docker-compose'

  def envFile = rootProject.file('.env')
  outputs.file envFile

  doLast {
    envFile.text = "LIFERAY_DXP_TAG=${liferayDxpTag}\n"
    println "Wrote ${envFile} (LIFERAY_DXP_TAG=${liferayDxpTag})"
  }
}

tasks.register('installGitHooks', Copy) {
  from("${rootProject.rootDir}/scripts/git-hooks") {
    include 'pre-*'
  }
  into "${rootProject.rootDir}/.git/hooks"
  filePermissions { unix(0775) }
}

if (System.getenv("CI") == null) {
  buildDockerImage {
    dependsOn 'installGitHooks', 'syncDockerEnv'
  }

  def installedHooksDir = file('.git/hooks')
  if (installedHooksDir.directory) {
    fileTree('scripts/git-hooks') { include 'pre-*' }.each { source ->
      def installed = new File(installedHooksDir, source.name)
      if (installed.file && !Arrays.equals(installed.bytes, source.bytes)) {
        installed.bytes = source.bytes
        installed.setExecutable(true)
        logger.lifecycle("Updated the installed git hook ${source.name} from scripts/git-hooks")
      }
    }
  }
}

tasks.register('copyTestDockerfile', Copy) {
  from "${rootProject.projectDir}/Dockerfile.test"
  into layout.buildDirectory.dir('docker')
}

tasks.register('downloadPortalTestBundle', Copy) {
  // release.dxp.bom does not manage com.liferay.portal.test, so the version is pinned
  // in gradle/libs.versions.toml and must be refreshed on every Liferay version bump.
  from configurations.detachedConfiguration(
    dependencies.create("com.liferay.portal:com.liferay.portal.test:${libs.versions.portal.test.asProvider().get()}")
  )
  into layout.buildDirectory.dir('docker/portal-test-libs')
  rename { 'com.liferay.portal.test.jar' }
  doFirst {
    println "Downloading com.liferay.portal.test bundle"
  }
}

tasks.register('downloadArquillianConnectorBundle', Copy) {
  from configurations.detachedConfiguration(
    dependencies.create(libs.liferay.arquillian.bridge.connector.get())
  ).setTransitive(false)
  into layout.buildDirectory.dir('docker/portal-test-libs')
  rename { 'com.liferay.arquillian.extension.junit.bridge.connector.jar' }
}

tasks.register('dockerBuildTestImage', Exec) {
  group = 'docker'
  description = 'Builds the Liferay test image (Dockerfile.test) with the application modules'
  dependsOn tasks.named('copyTestDockerfile'), tasks.named('downloadPortalTestBundle'), tasks.named('downloadArquillianConnectorBundle')
  def dockerDir = layout.buildDirectory.dir('docker')
  commandLine 'docker', 'build',
      '--build-arg', "LIFERAY_DOCKER_IMAGE=${liferayDockerImage}",
      '--tag', 'liferay-test',
      '--file', dockerDir.get().file('Dockerfile.test').asFile.absolutePath,
      dockerDir.get().asFile.absolutePath

  // The new image takes the tag over from the previous one, which would otherwise stay behind as a
  // dangling image with its own copy of the application jars. An image that a running test
  // container still uses is removed by dockerRunTestContainer, once it has replaced the container.
  def previousImageId = ''
  doFirst {
    previousImageId = jodTestImageId()
  }
  doLast {
    jodRemoveStaleTestImage(previousImageId)
  }
}

gradle.projectsEvaluated {
  def allDockerDeployTasks = []
  subprojects.each { p ->
    if (!p.name.endsWith('-test')) {
      allDockerDeployTasks += p.tasks.findByName('dockerDeploy')
    }
  }
  allDockerDeployTasks += tasks.findByName('dockerDeploy')
  allDockerDeployTasks = allDockerDeployTasks.findAll { it != null }

  tasks.named('dockerBuildTestImage') {
    dependsOn tasks.named('createDockerfile')
    dependsOn allDockerDeployTasks
  }
}

tasks.register('dockerRunTestContainer') {
  group = 'docker'
  description = 'Starts the Liferay test container and waits until its healthcheck passes (about two minutes)'
  mustRunAfter 'dockerBuildTestImage'

  // In the testWithDockerContainer workflow the container must not outlive the build, whichever
  // task fails after this one. Finalizers of this task run even then, unlike finalizers of
  // testWithDockerContainer, which does not run at all when one of its dependencies fails.
  // Outside the workflow they are skipped (jodTestContainerCleanupWanted).
  finalizedBy 'showDockerLogs', 'dockerStopTestContainer', 'integrationTestReport'

  doLast {
    // A container left behind by an interrupted run would make "docker run" fail on the name.
    def replacedImageId = jodTestContainerImageId()
    jodRemoveTestContainer()
    jodRemoveStaleTestImage(replacedImageId)

    exec {
      // No published ports: a port 8080 mapping would only clash with the local development stack.
      // The test JVM reads the test classes and jars from the two mounts and writes its reports
      // under the project mount.
      commandLine 'docker', 'run', '--detach', '--name', jodTestContainerName,
          '--volume', "${rootProject.projectDir.canonicalPath}:${jodContainerProjectDir}",
          '--volume', "${gradle.gradleUserHomeDir.canonicalPath}:${jodContainerGradleHomeDir}:ro",
          'liferay-test'
    }

    // Poll the HEALTHCHECK of Dockerfile.test. It allows ten minutes of "starting" on its own.
    println 'Waiting for the Liferay test container to become healthy (about two minutes)...'
    while (true) {
      def state = jodTestContainerState()
      if (state == 'running healthy') {
        break
      }
      if (state != 'running starting') {
        // In the workflow the finalizers show the logs and remove the container.
        if (!gradle.taskGraph.hasTask(':testWithDockerContainer')) {
          println "\n📋 Container logs (last 100 lines)..."
          exec {
            commandLine 'docker', 'logs', '--tail', '100', jodTestContainerName
            ignoreExitValue = true
          }
          jodRemoveTestContainer()
        }
        throw new GradleException("Liferay test container did not become healthy: ${state}")
      }
      Thread.sleep(5000)
    }
    println 'Liferay test container is healthy'
  }
}

tasks.register('dockerStopTestContainer') {
  group = 'docker'
  description = 'Stops and removes the Liferay test container'
  // Both are finalizers of dockerRunTestContainer: the logs must be shown while the container exists.
  mustRunAfter 'showDockerLogs', 'testWithDockerContainer'
  onlyIf('the container is not left running for single module runs') { jodTestContainerCleanupWanted() }
  doLast {
    jodRemoveTestContainer()
  }
}

tasks.register('dockerLogsTestContainer', Exec) {
  group = 'docker'
  description = 'Follows the logs of the Liferay test container'
  ignoreExitValue = true
  commandLine 'docker', 'logs', '-f', jodTestContainerName
}

gradle.projectsEvaluated {
  def integrationTestProjects = subprojects.findAll { it.name.endsWith('-test') }
  def integrationTestTasks = integrationTestProjects.collect { it.tasks.named('integrationTest') }

  if (jodSelectedIntegrationTests != null) {
    def known = integrationTestProjects.collectMany { it.jodIntegrationTestClasses } as Set
    def unknown = jodSelectedIntegrationTests - known
    if (!unknown.isEmpty()) {
      throw new GradleException("Unknown integration test classes in -PintegrationTests: ${unknown.sort().join(', ')}"
          + "\nKnown classes: ${known.sort().join(', ')}")
    }
  }

  integrationTestTasks.each { task ->
    task.configure { mustRunAfter ':dockerRunTestContainer' }
  }

  tasks.named('dockerRunTestContainer').configure {
    // Compile the tests before the container is started: a compile error would otherwise fail the
    // build with the container still running, as the finalizers of testWithDockerContainer only
    // run when that task itself runs.
    mustRunAfter integrationTestProjects.collect { it.tasks.named('prepareIntegrationTestBundle') }
  }

  tasks.named('testWithDockerContainer').configure {
    dependsOn integrationTestTasks
  }

  ['integrationTestReport', 'showDockerLogs', 'dockerStopTestContainer'].each { name ->
    tasks.named(name).configure {
      mustRunAfter integrationTestTasks
    }
  }
}

tasks.register('integrationTestReport', JavaExec) {
  group = 'verification'
  description = 'Merges the integration test results of all modules/*-test projects into one HTML report'

  def reportFile = layout.buildDirectory.file('reports/integration-tests/index.html')
  // When this build runs integration tests, only the results of the modules that ran are merged:
  // the results that a skipped module left behind in an earlier build do not belong to this run.
  // Without integration tests in the build, the report is made of everything on disk.
  def eventFiles = { ->
    def testTasks = subprojects.collect { it.tasks.findByName('integrationTest') }
        .findAll { it != null && gradle.taskGraph.hasTask(it) }
    def modules = testTasks.isEmpty()
        ? subprojects.findAll { it.name.endsWith('-test') }
        : testTasks.findAll { it.state.executed && !it.state.skipped }.collect { it.project }
    return modules
        .collect { it.layout.buildDirectory.file('test-results/integrationTest/open-test-report.xml').get().asFile }
        .findAll { it.file }
        .sort()
  }

  classpath = configurations.detachedConfiguration(
      dependencies.create(libs.open.test.reporting.cli.get()))
  mainClass = 'org.opentest4j.reporting.cli.ReportingCli'
  onlyIf('the container is not left running for single module runs') { jodTestContainerCleanupWanted() }
  onlyIf('integration test results exist') { !eventFiles().isEmpty() }

  doFirst {
    reportFile.get().asFile.parentFile.mkdirs()
    args(['html-report', '--output', reportFile.get().asFile.absolutePath] +
        eventFiles().collect { it.absolutePath })
  }
  doLast {
    println "Integration test report: ${reportFile.get().asFile.toURI()}"
  }
}

tasks.register('showDockerLogs', Exec) {
  group = 'docker'
  description = 'Shows the last 100 lines of the Liferay test container logs'
  ignoreExitValue = true
  mustRunAfter 'testWithDockerContainer'
  onlyIf('the container is not left running for single module runs') { jodTestContainerCleanupWanted() }
  commandLine 'docker', 'logs', '--tail', '100', jodTestContainerName
  doFirst {
    println '\n📋 Container logs (last 100 lines)...'
  }
}

tasks.register('testWithDockerContainer') {
  group = 'verification'
  description = 'Run tests against Docker container (builds image, starts container, runs tests, stops container)'

  dependsOn 'dockerBuildTestImage', 'dockerRunTestContainer'

  doFirst {
    println '================================================'
    println '🐳 Docker Container Test Workflow'
    println '================================================'
  }

  doLast {
    if (!jodFailedIntegrationTestModules.isEmpty()) {
      throw new GradleException(
          "Integration tests failed:\n  " + jodFailedIntegrationTestModules.join('\n  ')
              + "\nSee build/reports/integration-tests/index.html")
    }
    println '\n================================================'
    println '✅ Docker Container Test Workflow COMPLETE'
    println '================================================'
  }
}
