[versions]
# Liferay Gradle plugins (product/Docker version lives in gradle.properties)
liferay-workspace-plugin = "17.1.11"
liferay-test-integration-plugin = "4.0.0"
liferay-gradle-plugins = "16.1.206"

# Liferay test libraries. These are published on their own cadence and are NOT managed by
# release.dxp.bom or release.dxp.api, so they cannot follow liferay.workspace.product
# automatically. The rule is to use the newest published version and re-check it on every
# Liferay version bump - see README "Bumping the version". Check for newer ones with:
#   B=https://repository.liferay.com/nexus/content/groups/public/com/liferay/portal
#   curl -s "$B/com.liferay.portal.test/maven-metadata.xml"             | grep -oP '(?<=<version>)[^<]+' | tail -5
#   curl -s "$B/com.liferay.portal.test.integration/maven-metadata.xml" | grep -oP '(?<=<version>)[^<]+' | tail -5
# Newest published as of DXP 2026.q2.9 (verified, integration tests green):
portal-test = "34.1.0"
portal-test-integration = "6.0.36"
# Liferay Arquillian JUnit bridge (client, embedded into the test bundle) and its in-container connector.
# Not managed by release.dxp.bom either: re-check on every Liferay version bump.
arquillian-bridge = "1.0.23"
arquillian-bridge-connector = "1.0.2"

# Build / quality
spotless = "7.0.2"

# Test & logging
junit = "4.13.2"
# JUnit Platform console launcher + vintage engine run the JUnit 4 integration tests inside the Liferay test container
junit-platform = "6.0.3"
# Merges the modules' Open Test Reporting XML into one HTML report. Keep it on the version that
# junit-platform-reporting uses (its open-test-reporting-tooling-spi dependency).
open-test-reporting = "0.2.4"
awaitility = "4.3.0"
slf4j = "1.7.36"
log4j = "2.25.4"

# OSGi / servlet APIs
osgi-core = "6.0.0"
osgi-jaxrs = "1.0.1"
javax-servlet = "3.1.0"
javax-ws-rs = "2.1"
javax-validation = "2.0.1.Final"

# App libraries
jackson-datatype-jsr310 = "2.18.7"
# Provided at runtime by Liferay (com.liferay.shared.dependencies.pdfbox); keep aligned with the bundled version.
pdfbox = "3.0.7"
# Provided at runtime by Liferay (com.liferay.shared.dependencies.nimbusds); keep aligned with the bundled version.
nimbus-jose-jwt = "10.4"

[libraries]
liferay-workspace-plugin = { module = "com.liferay:com.liferay.gradle.plugins.workspace", version.ref = "liferay-workspace-plugin" }
liferay-test-integration-plugin = { module = "com.liferay:com.liferay.gradle.plugins.test.integration", version.ref = "liferay-test-integration-plugin" }
liferay-gradle-plugins = { module = "com.liferay:com.liferay.gradle.plugins", version.ref = "liferay-gradle-plugins" }

# Version comes from liferay.workspace.product / target platform (or derived in scripts)
liferay-dxp-api = { module = "com.liferay.portal:release.dxp.api" }
liferay-portal-test = { module = "com.liferay.portal:com.liferay.portal.test", version.ref = "portal-test" }
liferay-arquillian-bridge = { module = "com.liferay:com.liferay.arquillian.extension.junit.bridge", version.ref = "arquillian-bridge" }
liferay-arquillian-bridge-connector = { module = "com.liferay:com.liferay.arquillian.extension.junit.bridge.connector", version.ref = "arquillian-bridge-connector" }
liferay-portal-test-integration = { module = "com.liferay.portal:com.liferay.portal.test.integration", version.ref = "portal-test-integration" }

junit = { module = "junit:junit", version.ref = "junit" }
junit-platform-console = { module = "org.junit.platform:junit-platform-console", version.ref = "junit-platform" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junit-platform" }
open-test-reporting-cli = { module = "org.opentest4j.reporting:open-test-reporting-cli", version.ref = "open-test-reporting" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }

osgi-core = { module = "org.osgi:org.osgi.core", version.ref = "osgi-core" }
osgi-jaxrs = { module = "org.osgi:org.osgi.service.jaxrs", version.ref = "osgi-jaxrs" }
javax-servlet-api = { module = "javax.servlet:javax.servlet-api", version.ref = "javax-servlet" }
javax-ws-rs-api = { module = "javax.ws.rs:javax.ws.rs-api", version.ref = "javax-ws-rs" }
javax-validation-api = { module = "javax.validation:validation-api", version.ref = "javax-validation" }

jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson-datatype-jsr310" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbus-jose-jwt" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
